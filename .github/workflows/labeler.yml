---
name: Pull request labeler
on:
  schedule:
    - cron: '*/15 * * * *'
jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: paulfantom/periodic-labeler@f47a62ac0749f9bdd8f81a1e0fedb253b8af1505 # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
